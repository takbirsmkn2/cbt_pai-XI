const PASS={"XI 1":"bahar1","XI 2":"bahar2"}, TPASS="bahruddin05";
/* ===== DATA SOAL (50 nomor, kunci a–e) ===== */
const Q=[{"q": "Salah satu anda-tanda kekuasaan Allah Swt dalam QS. Ali Imran/3:190-191 adalah…", "o": ["Dia telah menciptakan manusia dalam bentuk yang sebaik-baiknya", "Bertiupnya angin", "Turunnya hujan", "Proses penciptaan langit dan bumi", "Proses penciptaan manusia"], "k": 3}, {"q": "Arti dari penggalan ayat yang bergaris bawah adalah… <div class=\"arb\">ٱلَّذِينَ يَذۡكُرُونَ ٱللَّهَ قِيَٰمٗا وَقُعُودٗا وَعَلَىٰ جُنُوبِهِمۡ وَيَتَفَكَّرُونَ فِي خَلۡقِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ <u>رَبَّنَا مَا خَلَقۡتَ هَٰذَا بَٰطِلٗا </u>سُبۡحَٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ</div>", "o": ["Tiadalah Aku ciptakan jin dan manusia kecuali untuk menyembah kepada-Ku", "Tiadalah Engkau menciptakan semua ini sia-sia", "Tidakkah engkau pikirkan bagaimana Allah menciptakan langit dan bumi", "Maha suci Engkau", "Jauhkanlah kami dari azab api neraka"], "k": 1}, {"q": "Arti kata lafazh berikut “<u><span class=\"ar\">لِّأُوْلِي ٱلۡأَلۡبَٰبِ</span> </u>", "o": ["Bagi orang-orang yang beriman", "Bagi orang-orang shaleh", "Bagi orang-orang bertawakkal", "Agar kamu manjadi orang yang beruntung", "Bagi orang-orang yang berakal"], "k": 4}, {"q": "<div class=\"arb\">Arti penggalan ayat yang bergaris bawahإِنَّ فِي خَلۡقِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ <u>وَٱخۡتِلَٰفِ ٱلَّيۡلِ وَٱلنَّهَارِ  </u></div>", "o": ["Orang-orang yang  mengingat Allah dalam keadaan berdiri", "Sesungguhnya dalam penciptaan langit dan bumi", "Orang-orang yang mengingat Allah dalam keadaan berbaring", "Dan silih bergantinya malam dan siang", "Orang-orang yang mengingat Allah dalam keadaan duduk"], "k": 3}, {"q": "Hukum bacaan Lafazh “ <span class=\"ar\">قِيَٰمٗا وَقُعُودٗا</span>", "o": ["Qalqalah sughra", "Idgham bighunnah", "Qalqalah kubra", "Idgham bilaghunnah", "Alif lam qamariyah"], "k": 3}, {"q": "Lafazh berikut menunjukkan hukum bacaan  “<u><span class=\"ar\">فِي خَلۡقِ ٱلسَّمَٰوَٰت</span> </u>", "o": ["izhar", "Ikhfa", "Alif lam Qamariyah", "Alif lam Syamsiyah", "Ghunnah"], "k": 3}, {"q": "<div class=\"arb\">يَٰمَعۡشَرَ ٱلۡجِنِّ وَٱلۡإِنسِ إِنِ ٱسۡتَطَعۡتُمۡ أَن تَنفُذُواْ منۡ أَقۡطَارِ ٱلسَّمَٰوَٰت وَٱلۡأَرۡضِ فَٱنفُذُواْۚ لَا تَنفُذُونَ إِلَّا بِسُلۡطَٰنٖ</div>Ayat tersebut di atas terdapat dalam…", "o": ["QS. Al Jin/72:11", "QS. Ar Rahman/55:4", "QS.Ar Rahman /55:33", "QS. Al Jin/72:16", "QS. Al Hasyr/59:12"], "k": 2}, {"q": "Manusia diperintahkan untuk selalu berpikir kritis karena...", "o": ["Akan melahirkan karakter serba ingin tahu urusan orang lain", "Selalu antusias dan membuat temannya minder", "Selalu ingin tahu masalah orang lain", "Membuat kemampuan berpikir seseorang menurun", "Akan mengasah kemampuan analisis pikiran manusia"], "k": 4}, {"q": "Berikut yang tidak termasuk manfaat mencintai Iptek ialah…", "o": ["Menciptakan sikap rajin dan semangat belajar", "Menciptakan peluang untuk menemukan teori baru", "Melahirkan pribadi yang kurang mandiri", "Mempermudah pekerjaan manusia", "Menciptakan peluang untuk manjadi ilmuwan"], "k": 2}, {"q": "Contoh perilaku berpikir kritis dalam kehidupan sehari-hari ialah…", "o": ["mengajak temannya berdiskusi yang bertujuan untuk mengukur potensi dirinya", "selalu memperhatikan setiap penjelasan guru", "menjauhi temannya yang tidak sependapat dengannya", "malas mendengar penjelasan dai guru karena ia sudah paham", "terburu-buru dalam memutuskan sesuatu agar bisa mendahului temannya"], "k": 0}, {"q": "Q. S. Almaidah/5: 1 perhatikan ayat diatas dengan baik, ayat tersebut berkaitan tentang….", "o": ["Mengolok-olok orang lain", "Menutupi aib orang lain", "Menjaga lisan", "Menepati janji", "Mensyukuri nikmat"], "k": 3}, {"q": "Memenuhi janji menjadi faktor penting pada kesuksesan seseorang, Adapun     keuntungan dari perilaku memenuhi janji ialah, kecuali…", "o": ["Terus dicari keberadaannya karena amanah", "Dimudahkan jalan hidupnya", "Jauh dari kebimbangan hidup", "Hilangnya kepercayaan orang lain pada dirinya", "Hidupnya menjadi berkah"], "k": 3}, {"q": "QS. Ibrahim/14:7 menjelaskan tentang pentingnya…", "o": ["Mensyukuri nikmat", "Menepati janji", "Menutupi aib orang lain", "Menjaga lisan", "Menjaga silaturrahmi dengan sesame"], "k": 0}, {"q": "“pada hari (ketika) lidah, tangan dan kaki mereka menjadi saksi terhaadap apa yang dahulu mereka kerjakan”, merupakan terjemahan dari…", "o": ["QS. Ali Imran/3:102/", "QS. Yunus/10:6", "QS. Saba/34/7", "QS. QS. An Nur/24:24", "QS. Qaf/57:17"], "k": 3}, {"q": "Sebuah hadis Nabi yang diriwayakan oleh Imam At Tirmidzi menyebutkan bahwa dua hal yang menjerumuskan seseorang ke dalam neraka, yaitua…", "o": ["Mulut dan kemaluan", "Kaki dan tangan", "Mata dan lisan", "Hati dan mata", "Telinga dan mata"], "k": 0}, {"q": "Jika ia berbicara ia dusta adalah salah satu ciri orang…", "o": ["Ingkar", "Pembohong", "Munafik", "Hasad", "Ghiba"], "k": 2}, {"q": "Seseorang yang akan ditambah nikmatnya oleh Allah ialah orang yang…", "o": ["Bertakwa", "Tawakkal", "Beriman", "Ikhlas", "Bersyukur"], "k": 4}, {"q": "Yang bukan merupakan jenis narkotika berikut ini adalah…", "o": ["Putaw", "Ganja", "Obat tidur atau obat penenang", "Kokain", "Morfin"], "k": 2}, {"q": "Dalam QS. An Nahl/16:67 terdapat 2 jenis buah yang disebutkan Allah Swrt yang     bisa dijadikan khamr atau rezeki yang halal, yaitu…", "o": ["Delima dan anggur", "Kurma dan delima", "Anggur dan mangga", "Kurma dan mangga", "Kurma dan anggur"], "k": 4}, {"q": "Ciri pelajar yang didambakan islam ialah…", "o": ["Cerdas", "Cerdas tapi tidak santun", "Cerdas dan berakhlakul karimah", "Percaya diri", "Selalu menang dalam setiap lomba"], "k": 2}, {"q": "Cara mencegah perilaku menyimpang pada pelajar yaitu, kecuali…", "o": ["Memberi kesempatan kepada pelajar untuk dapat mengembangkan potensinya", "Menyamakan potensi pada setiap anak sehingga muncul sikap diskriminasi", "Upaya Pengembangan diri yang optimal", "Membentuk perkembangan pelajar di sekolah dengan baik", "Menyadari bahwa setiap anak diberi potensi yang berbeda"], "k": 1}, {"q": "Faktor yang tidak termasuk pemicu perkelahian antar pelajar ialah…", "o": ["Faktor personal atau individu", "Faktor lingkungan", "Faktor pertandingan", "Faktor kurangnya pengawasan orang tua", "Faktor salah bergaul"], "k": 2}, {"q": "Perhatikan ayat  90 – 91 tentang khamar di atas. terdapat dalam surah apakah ayat tersebut….", "o": ["Al Maidah", "Al Baqarah", "An Nahl", "An Hujurat", "Al Mukminun"], "k": 0}, {"q": "Upaya yang bisa dilakukan dalam pencegahan narkoba di sekolah, kecuali…", "o": ["Berteman dengan siapa saja di lingkunagan masyarakat", "Bekerja sama instansi terkait guna penyuluhan dan sosialisasi", "Menggunakan ekstrakurikuler sebagai sarana pencegahan", "Perlu memasukkan dalam tata tertib sekolah", "Melakukan razia intensif dan spontan pada siswa"], "k": 0}, {"q": "Yang tidak termasuk dampak negatif dari penyalahgunaan narkoba ialah…", "o": ["Perubahan sikap pada diri remaja", "Emosi tidak terkontrol", "Tidak adanya perilaku menyimpang", "Mempengaruhi sistim saraf otak", "Gangguan kesehatan, mental dan perilaku"], "k": 2}, {"q": "‘‘Setiap yang memabukkan adalah  khamr dan setiap khamr diharamkan”, adalah…", "o": ["HR. Muslim", "HR. Abu Daud", "HR. At Tirmidzi", "HR. Ibnu Majah", "HR. Bukhari"], "k": 1}, {"q": "Dalam QS. Al Maidah/5:90 menyebutkan perbuatan keji dan termasuk perbuatan    setan, kecuali…", "o": ["Mencuri", "Minuman keras", "Berkurban untuk berhala", "Mengundi nasib dengan anak panah", "Berjudi"], "k": 0}, {"q": "Islam, baliq, berakal sehat dan mengetahui ilmu agama adalah merupakan…", "o": ["Syarat khutbah", "Etika berdakwah", "Sunnah khutbah", "Syarat khatib", "Orang beriman"], "k": 3}, {"q": "Kata tabligh secara istilah berarti", "o": ["Menyampaikan pesan secara lisan", "Memberi nasehat dalam kegiatan ibadah", "Menyeru kepada kebaikan", "Mencegah kemungkaran", "Menyampaikan kabar gembira"], "k": 0}, {"q": "Yang tidak termasuk rukun khutbah ialah...", "o": ["Khatib berdiri ketika berkhutbah", "Membaca hamdalah", "Membaca shalawat", "Membaca ayat Al Qur’an pada salah satu khutbah", "Berwasiat taqwa"], "k": 0}, {"q": "“Hendaklah ada segolongan orang yang menyeru kepada kebaikan dan melarang kepada kemungkaran”, hal ini dikenal dengan istilah...", "o": ["Fastabiqul khaerat", "Amar ma’ruf nahi munkar", "Khaira ummah", "Ibda’ binafsik", "Dinul haq"], "k": 1}, {"q": "Khutbah merupakan rangkaian ibadah yang berkaitan langsung dengan keabsahan dan kesunahan ibadah seperti pada pelaksanaan salat jum’at, i’ed, kusuf dan lai-lain, salat   kusuf ialah...", "o": ["Salat meminta diturunkannya hujan", "Salat meminta petunjuk", "Salat dua gerhana", "Salat memohon kemudahan rezeki", "Salat meminta hajat tertentu"], "k": 2}, {"q": "“Barang siapa yang melihat kemungkaran maka hendaklah mengubahnya dengan tangannya”, maksud hadis di atas adalah...", "o": ["Mencemooh keduanya", "Mengabaikannya", "Memprovokasi keduanya", "Mencegah permusuhan di antara keduanya", "Tidak ikut campur urusan keduanya"], "k": 3}, {"q": "Dalam QS. Ali Imran/3:110 menjelaskan bahwa kita adalah umat terbaik yang dilahirkan untuk manusia, hal ini menjelaskan bahwa...", "o": ["Dakwah menjadi tugas semua muslim/muslimah", "Dakwah adalah tugas para muballigh", "Dakwah tidak wajib dilakukan", "Dakwah adalah kewajiban para da’i", "Dakwah dimulai dari diri sendiri"], "k": 0}, {"q": "Apabila ada orang yang mengatakan, “saya nanti saja kalau sudah tua baru bertobat dan akan menjalankan ajaran agama secara maksimal, sekarang saya belum bisa menjaga diri.” Hal yang harus kamu lakukan adalah sebagai berikut, kecuali ....", "o": ["membiarkan saja karena itu urusan dia, biar dia sendiri yang menanggungnya", "membujuknya untuk bertobat sekarang", "mengingatkan bahwa kematian seseorang tidak ada yang tahu", "segeralah bertobat sebelum terlambat", "memberikan tausiah kisah-kisah teladan"], "k": 1}, {"q": "Ketika khatib sedang berkhutbah, temanmu berbicara atau ngobrol. Hal yang kamu lakukan adalah ...", "o": ["mengatakan kepadanya kalau berbicara saat khatib sedang berkhutbah dapat membatalkan pahala salatnya", "memberi tahukan kepada orang tuanya kalau anaknya suka bercanda saat salat jumat berlangsung.", "menjauhinya karena takut kita terpengaruh oleh perilaku-perilaku tercelanya", "membiarkan dia ngobrol sendiri karena sedang khusyu mendengarkan khutbah.", "memberi isyarat padanya agar tidak berbicara atau ngobrol"], "k": 3}, {"q": "Pada Q. S. Al Imran/3: 104 di atas berkaitan tentang….", "o": ["Perlunya dakwah", "Perlunya tabliq", "Perlunya khutbah", "Perlunya adab", "Perlunya teladan yang baik"], "k": 0}, {"q": "Pada Q. S. an Nahl/16: 125 berkaitan tentang adab dan etika dakwah yang harus diperhatikan antara lain, kecuali…", "o": ["Dakwah dengan cara hikmah", "Dakwah dengan cara mauidzatul hasanah", "Dakwah dengan cara mujadalah", "Dakwah dengan cara uswatun hasanah", "Dakwah dengan cara Mauidzatul sayyi'ah"], "k": 4}, {"q": "Perhatikan Q. S. al Jumuah/62: 9 di atas. Isi yang terkandung dari ayat di atas adalah, kecuali…", "o": ["Kewajiban melakukan shalat", "Menghentikan kegiatan jual beli", "Bersiap-siap mendengarkan khutbah", "Segera ke masjid untuk shalat juma’at", "Kewajiban melakukan 2 kali khutbah"], "k": 3}, {"q": "Terjemahan pada ayat di atas …", "o": ["(yaitu) orang-orang yang mengingat Allah sambil berdiri, duduk, atau dalam keadaan berbaring, dan memikirkan tentang penciptaan langit dan bumi (seraya berkata), “Ya Tuhan kami, tidaklah Engkau menciptakan semua ini sia-sia. Mahasuci Engkau. Lindungilah kami dari azab neraka.", "Sesungguhnya dalam penciptaan langit dan bumi serta pergantian malam dan siang terdapat tanda-tanda (kebesaran Allah) bagi orang yang berakal,", "Ya Tuhan kami, sesungguhnya orang yang Engkau masukkan ke dalam neraka, maka Engkau benar-benar telah menghinakannya dan tidak ada seorang penolong pun bagi orang yang zalim.", "Ya Tuhan kami, sesungguhnya kami mendengar orang yang menyeru pada keimanan, yaitu ‘Berimanlah kamu kepada Tuhanmu,’ maka kami pun beriman. Ya Tuhan kami, ampunilah dosa-dosa kami, hapuskanlah kesalahan-kesalahan kami, dan wafatkanlah kami beserta orang-orang yang selalu berbuat kebaikan.", "Ya Tuhan kami, anugerahilah kami apa yang telah Engkau janjikan kepada kami melalui rasul-rasul-Mu dan janganlah Engkau hinakan kami pada hari Kiamat. Sesungguhnya Engkau tidak pernah mengingkari janji.”"], "k": 1}, {"q": "Seorang da’i atau muballigh sebelum memulai dakwahnya hendaklah berperilaku “ibda’ binafsik” yaitu…", "o": ["Memulai dari diri sendiri", "Mencegah kemungkaran", "Mengajak kepada kebaikan", "Mengambil conoh dari hal yang baik", "Berbagi rezeki kepada orang sekitar"], "k": 0}, {"q": "dalam menyampaikan tabligh ada beberapa ketentuan yang harus diperhatikan yaitu, kecuali...", "o": ["disampaikan dengan cara yang sopan dan lemah lembut", "menggunakan istilah atau bahasa asing agar kedengaran lebih hebat", "Mengedepankan musyawarah dan diskusi", "Materi yang disampaikan harus merujuk kepada sesuatu yang jelas sumbernya", "Tidak menghasut orang lain untuk bermusuhan"], "k": 1}, {"q": "Salah satu metode dakwah Rasulullah saw. Adalah “uswatun hasanah” artinya ...", "o": ["dengan kata-kata yang jelas", "tutur kata yang sopan", "dengan gaya yang menarik", "nasihat dan pengajaran yang baik", "contoh atau teladan yang baik"], "k": 4}, {"q": "begitu berbahayanya khamr dalam kehidupan pribadi, keluarga, masyarakat dan kelangsungan hidup berbangsa dan bernegara maka sikap yang perlu dilakukan adalah...", "o": ["menggunakan zat atau bahan tersebut secara wajar", "menghindari meminum khamr", "menggunakan kepandaiannya meracik zat dan bahan yang berbahaya", "menahan dan menghentikan keinginannya yang berlebih", "Lebih teliti dalam menggunakan bahan yang bisa berakibat memabukkan"], "k": 1}, {"q": "Dalam QS. Al Maidah/5:91 menjelaskan bahwa dengan minuman keras itu setan hanyalah bermaksud…", "o": ["Menimbulkan permusuhan dan kebencian diantara manusia", "Membiarkan manusia beramal shaleh", "Menghalangi manusia beramal shaleh", "Menghalangi manusia untuk menunaikan shalat", "Membiarkan manusia bersegera melakukan kebaikan"], " async function loginS(){
 const n=$("#nm").value.trim().replace(/\s+/g," "),k=$("#kl").value,p=$("#pw").value;
 if(n.length<3)return err("Masukkan nama lengkap Anda.");
 if(p.trim().toLowerCase()!==PASS[k])return err("Password kelas salah.");
 $("#go").disabled=true;$("#er").textContent="Memeriksa data...";
 try{const id=key(n),r=await ST.get(id);
  if(r&&r.status==="done")return err("Nama ini sudah mengerjakan ujian. Hubungi guru jika ada kendala.");
  if(r&&r.dev!==DEV)return err("Ujian nama ini sedang berjalan di perangkat lain. Hubungi guru untuk reset.");
  S={id,n,k,r};viewRules()}
 catch(e){err("Gagal terhubung ke penyimpanan. Periksa koneksi internet.")}
}
function viewRules(){
 const res=!!S.r;
 app.innerHTML=`<div class="login card" style="max-width:560px"><h1>Petunjuk Ujian</h1><div class="sub">${esc(S.n)} • Kelas ${S.k}</div>
 <ul style="padding-left:20px;margin:0 0 14px"><li>Jumlah soal <b>${Q.length}</b> pilihan ganda, waktu <b>90 menit</b> dihitung sejak tombol Mulai ditekan.</li>

 <li>Setiap pelanggaran dicatat dan dilihat guru. Pada pelanggaran ke-<b>${MAXV}</b> ujian ditutup otomatis.</li>
 <li>Jawaban tersimpan otomatis. Ujian tertutup sendiri saat waktu habis.</li></ul>
 <button class="bp" style="width:100%" onclick="begin()">${res?"Lanjutkan Ujian":"Mulai Ujian"}</button>
 <button class="bs" style="width:100%;margin-top:8px" onclick="viewLogin()">Kembali</button><div class="err" id="er"></div></div>`;
}
async function begin(){
 try{let r=await ST.get(S.id);
  if(r&&r.status==="done")return err("Ujian sudah diselesaikan.");
  if(r&&r.dev!==DEV)return err("Ujian berjalan di perangkat lain.");
  if(!r){const ord=shuf([...Q.keys()]).map(i=>i+"."+shuf([0,1,2,3,4]).join("")).join(",");
   r={name:S.n,kelas:S.k,status:"ongoing",start:Date.now(),ord,a:{},viol:0,dev:DEV};await ST.put(S.id,r)}
  r.a=r.a||{};S.r=r;S.o=parseOrd(r.ord);S.cur=0;S.fl={};LS.cbt_s=S.id;
  try{await document.documentElement.requestFullscreen()}catch(e){}
  guards(true);drawExam();tmr=setInterval(tick,1000);tick();
 }catch(e){err("Gagal memulai. Periksa koneksi.")}
}
/* ===== UJIAN ===== */
function tick(){const rem=S.r.start+DUR-Date.now();if(rem<=0)return finish("Waktu pengerjaan habis.");const t=$("#tm");if(t){t.textContent=fmt(rem);t.classList.toggle("low",rem<5*60e3)}}
function drawExam(){
 document.body.classList.add("x");
 const o=S.o[S.cur],q=Q[o.i],a=S.r.a["q"+o.i],done=Object.keys(S.r.a).length;
 app.innerHTML=`<div class="wrap"><div class="top"><div><b>${esc(S.n)}</b><small>Kelas ${S.k} • PAI & BP</small></div><div class="tm" id="tm">--:--:--</div></div>
 <div class="grid"><div class="card"><div class="prog"><i style="width:${done/Q.length*100}%"></i></div>
 <div class="qn">Soal ${S.cur+1} dari ${Q.length}</div><div class="qt">${qhtml(o.i)}</div>
 ${o.p.map((orig,pos)=>`<button class="op ${a===orig?"s":""}" onclick="pick(${orig})"><span>${L[pos]}</span><div>${q.o[orig]}</div></button>`).join("")}
 <div class="nav"><button class="bs" ${S.cur?"":"disabled"} onclick="go(${S.cur-1})">◀ Sebelumnya</button>
 <button class="bw" onclick="flag()">${S.fl[S.cur]?"★ Batal ragu":"☆ Ragu-ragu"}</button>
 ${S.cur<Q.length-1?`<button class="bp" onclick="go(${S.cur+1})">Selanjutnya ▶</button>`:`<button class="bp" onclick="confirmEnd()">Selesai ✔</button>`}</div></div>
 <div class="card"><b>Navigasi Soal</b><div class="lg">Terjawab ${done}/${Q.length}</div>
 <div class="pal">${S.o.map((x,i)=>`<button class="${S.r.a["q"+x.i]!==undefined?"a":""} ${S.fl[i]?"f":""} ${i==S.cur?"c":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div>
 <div class="lg">Biru: terjawab • Kuning: ragu • Garis: soal aktif</div>
 <button class="bp" style="width:100%;margin-top:14px" onclick="confirmEnd()">Kumpulkan Jawaban</button>
 <div style="margin-top:10px;text-align:center">${cloudBadge()}</div></div></div></div>`;
 tick();
}
const go=i=>{S.cur=i;drawExam();scrollTo(0,0)};
const flag=()=>{S.fl[S.cur]=!S.fl[S.cur];drawExam()};
let sv=0;
function pick(orig){S.r.a["q"+S.o[S.cur].i]=orig;drawExam();save()}
function save(now){clearTimeout(sv);sv=setTimeout(()=>{S.r.seen=Date.now();ST.put(S.id,S.r).catch(()=>toast("Koneksi bermasalah, jawaban akan disimpan ulang."))},now?0:350)}
function modal(h){const d=document.createElement("div");d.className="ov";d.id="md";d.innerHTML=`<div class="card">${h}</div>`;document.body.appendChild(d)}
const closeM=()=>{const m=$("#md");m&&m.remove()};
function confirmEnd(){const k=Q.length-Object.keys(S.r.a).length;

 <button class="bp" onclick="closeM();finish()">Ya, kumpulkan</button> <button class="bs" onclick="closeM()">Periksa lagi</button>`)}
async function finish(msg){
 clearInterval(tmr);guards(false);closeM();

 app.innerHTML=`<div class="login card" style="text-align:center"><div class="logo">${ok?"✅":"⚠️"}</div><h1>${ok?"Ujian Selesai":"Jawaban belum terkirim"}</h1>

}

let gOn=false,lv=0,W0=0,H0=0;
function viol(why){
 if(!gOn||Date.now()-lv<2500)return;lv=Date.now();
 S.r.viol=(S.r.viol||0)+1;save(true);
 if(S.r.viol>=MAXV)return finish("Ujian ditutup otomatis karena pelanggaran berulang.");
 closeM();modal(`<div class="logo">🚫</div><h1>Pelanggaran ${S.r.viol} dari ${MAXV}</h1><p>${why}. Pelanggaran dicatat dan dilihat guru. Pada pelanggaran ke-${MAXV} ujian ditutup otomatis.</p>
 <button class="bp" onclick="closeM();document.documentElement.requestFullscreen?.().catch(()=>{})">Kembali ke ujian</button>`);
}
const G={
 vis:()=>document.hidden&&viol("Anda meninggalkan halaman ujian"),
 blur:()=>viol("Fokus layar berpindah dari halaman ujian"),
 fs:()=>{if(document.fullscreenEnabled&&!document.fullscreenElement)viol("Anda keluar dari mode layar penuh")},
 rs:()=>{H0=Math.max(H0,innerHeight);W0=Math.max(W0,innerWidth);if(innerHeight<H0*.78||innerWidth<W0*.78)viol("Terdeteksi layar terbagi / jendela mengambang")},
 nb:e=>{e.preventDefault();e.returnValue=""},
 no:e=>e.preventDefault(),

};
function guards(on){
 gOn=on;const f=on?"addEventListener":"removeEventListener";H0=innerHeight;W0=innerWidth;
 document[f]("visibilitychange",G.vis);window[f]("blur",G.blur);document[f]("fullscreenchange",G.fs);window[f]("resize",G.rs);window[f]("beforeunload",G.nb);
 ["contextmenu","copy","cut","paste","dragstart"].forEach(e=>document[f](e,G.no));document[f]("keydown",G.key);
}

 <div><button class="bs" onclick="delete SS.cbt_t;viewLogin()">Keluar</button></div></div>
 <div class="card"><div class="tabs" style="max-width:420px"><button id="t1" onclick="S.tab='rekap';tabs()">Rekap Nilai</button><button id="t2" onclick="S.tab='soal';tabs()">Soal & Kunci</button></div><div id="pn"></div></div></div>`;
 tabs();await refresh();clearInterval(poll);poll=setInterval(refresh,5000);
}
function tabs(){$("#t1").className=S.tab=="rekap"?"on":"";$("#t2").className=S.tab=="soal"?"on":"";S.tab=="rekap"?rekap():soal()}
async function refresh(){try{S.d=await ST.all();if(S.tab=="rekap")tbl()}catch(e){toast("Gagal memuat data cloud")}}
function rows(){return Object.entries(S.d||{}).map(([id,r])=>{const live=r.status==="done"||Date.now()>r.start+DUR,c=calc(r);return{id,...r,...c,fin:live,nilai:live?c.nilai:null,st:r.status==="done"?"Selesai":live?"Waktu habis":"Mengerjakan"}})
 .filter(r=>(!S.kl||r.kelas===S.kl)&&r.name.toLowerCase().includes(S.q.toLowerCase())).sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.name.localeCompare(b.name))}
function rekap(){
 $("#pn").innerHTML=`<div class="bar"><input id="sq" placeholder="Cari nama siswa..." value="${esc(S.q)}" oninput="S.q=this.value;tbl()">
 <select onchange="S.kl=this.value;tbl()"><option value="">Semua kelas</option><option ${S.kl=="XI 1"?"selected":""}>XI 1</option><option ${S.kl=="XI 2"?"selected":""}>XI 2</option></select>
 <button class="bp" onclick="csv()">⬇ CSV</button><button class="bp" onclick="pdf()">⬇ PDF</button><button class="bs" onclick="refresh()">↻ Muat ulang</button></div><div id="stat"></div><div class="tbw" id="tb"></div>`;tbl();
}
function tbl(){
 if(!$("#tb"))return;const R=rows(),F=R.filter(r=>r.nilai!==null),n=F.map(r=>r.nilai);
 $("#stat").innerHTML=`<div class="st"><div><b>${R.length}</b><small>Peserta</small></div><div><b>${R.filter(r=>r.st=="Mengerjakan").length}</b><small>Sedang mengerjakan</small></div><div><b>${F.length}</b><small>Selesai</small></div>
 <div><b>${n.length?(n.reduce((a,b)=>a+b,0)/n.length).toFixed(1):"-"}</b><small>Rata-rata</small></div><div><b>${n.length?Math.max(...n):"-"}</b><small>Tertinggi</small></div><div><b>${n.length?Math.min(...n):"-"}</b><small>Terendah</small></div></div>`;
 $("#tb").innerHTML=`<table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Mulai</th><th>Selesai</th><th>Terjawab</th><th>Benar</th><th>Salah</th><th>Nilai</th><th>Pelanggaran</th><th>Aksi</th></tr>
 ${R.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.kelas}</td><td>${r.st}</td><td>${dt(r.start)}</td><td>${dt(r.end)}</td><td>${Q.length-r.kosong}/${Q.length}</td><td>${r.fin?r.benar:"-"}</td><td>${r.fin?r.salah:"-"}</td><td><b>${r.nilai??"-"}</b></td><td>${r.viol||0}</td>
 <td><button class="bw" onclick="reset('${r.id}')">Reset</button></td></tr>`).join("")||'<tr><td colspan="12" style="text-align:center;color:var(--mu)">Belum ada data.</td></tr>'}</table>`;
}
function reset(id){const n=esc((S.d[id]||{}).name||"");modal(`<h1>Reset pekerjaan?</h1><p>Seluruh jawaban <b>${n}</b> dihapus dan siswa dapat login kembali dengan soal yang diacak ulang.</p>
 <button class="bd" onclick="doReset('${id}')">Ya, reset</button> <button class="bs" onclick="closeM()">Batal</button>`)}
async function doReset(id){closeM();try{await ST.del(id);toast("Pekerjaan siswa berhasil direset.");refresh()}catch(e){toast("Gagal reset, coba lagi.")}}
function soal(){
 $("#pn").innerHTML=`<p class="lg">Daftar ${Q.length} soal (urutan asli) beserta kunci jawaban.</p>`+Q.map((q,i)=>`<div class="kq"><b>${i+1}.</b> <div class="qt">${qhtml(i)}</div><ul style="list-style:none;padding-left:8px;margin:0">${q.o.map((o,j)=>`<li class="${j==q.k?"ok":""}">${L[j].toLowerCase()}. ${o}${j==q.k?" ✔":""}</li>`).join("")}</ul><div class="k">Kunci: ${L[q.k]}</div></div>`).join("");
}
function dl(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
const hdr=["No","Nama","Kelas","Status","Mulai","Selesai","Durasi (menit)","Benar","Salah","Kosong","Nilai","Pelanggaran"];
const line=(r,i)=>[i+1,r.name,r.kelas,r.st,dt(r.start),dt(r.end),r.end?Math.round((r.end-r.start)/6e4):"",r.fin?r.benar:"",r.fin?r.salah:"",r.fin?r.kosong:"",r.nilai??"",r.viol||0];
function csv(){const t=[hdr,...rows().map(line)].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");dl(`rekap-nilai-PAI-XI-${new Date().toISOString().slice(0,10)}.csv`,new Blob(["\ufeff"+t],{type:"text/csv;charset=utf-8"}))}
function pdf(){
 const R=rows();$("#print").innerHTML=`<h2 style="color:#0b2a6f;margin:0">Rekap Nilai ${JUDUL}</h2><p>Mata Pelajaran PAI dan BP • Kelas ${S.kl||"XI 1 & XI 2"} • Dicetak ${dt(Date.now())}</p>
 <table border="1" cellpadding="4" style="border-collapse:collapse;width:100%"><tr>${hdr.map(h=>`<th>${h}</th>`).join("")}</tr>${R.map((r,i)=>`<tr>${line(r,i).map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
 toast("Pilih 'Simpan sebagai PDF' pada dialog cetak.");setTimeout(()=>print(),400);
}

(async()=>{
 if(SS.cbt_t){S={tab:"rekap",kl:"",q:"",d:{}};return viewGuru()}
 const id=LS.cbt_s;
 if(id){try{const r=await ST.get(id);if(r&&r.status==="ongoing"&&r.dev===DEV){S={id,n:r.name,k:r.kelas,r};
   if(Date.now()>=r.start+DUR){S.o=parseOrd(r.ord);return finish("Waktu pengerjaan habis.")}return viewRules()}}catch(e){}}
 viewLogin();
})().catch(()=>viewLogin());
</script></body></html>
